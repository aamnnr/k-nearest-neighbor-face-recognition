{% extends "base.html" %}
{% block title %}Edit Pengguna{% endblock %}
{% block heading %}<h1>Edit Pengguna</h1>{% endblock %}
{% block content %}
    <form class="user-form" method="POST" action="{{ url_for('edit_user', user_id=user_id) }}">
        {% include "_user_form_fields.html" %}
        <input type="submit" class="btn btn-success" value="Update Pengguna">
    </form>
    <div class="actions">
        <a href="{{ url_for('manage_users') }}" class="btn btn-secondary">Kembali ke Manajemen Pengguna</a>
    </div>
{% endblock %}
