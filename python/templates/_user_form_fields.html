{# Field form data diri, dipakai oleh register_user.html dan edit_user.html #}
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-grid">
    <div class="form-field full">
        <label for="nama">Nama Lengkap</label>
        <input class="input" type="text" id="nama" name="nama" maxlength="100" required autocomplete="off"
               title="Nama hanya boleh berisi huruf dan spasi." value="{{ form.nama }}">
    </div>
    <div class="form-field">
        <label for="no_hp">Nomor HP</label>
        <input class="input" type="text" id="no_hp" name="no_hp" pattern="[0-9]{10,15}" inputmode="numeric" required
               title="Nomor HP harus berupa angka, 10-15 digit." placeholder="081234567890" value="{{ form.no_hp }}">
    </div>
    <div class="form-field">
        <label for="tanggal_lahir">Tanggal Lahir</label>
        <input class="input" type="date" id="tanggal_lahir" name="tanggal_lahir" max="{{ today }}" required value="{{ form.tanggal_lahir }}">
    </div>
    <div class="form-field">
        <label for="jenis_kelamin">Jenis Kelamin</label>
        <select class="input" id="jenis_kelamin" name="jenis_kelamin" required>
            <option value="">Pilih jenis kelamin</option>
            {% for option in ['Laki-laki', 'Perempuan'] %}
                <option value="{{ option }}" {% if form.jenis_kelamin == option %}selected{% endif %}>{{ option }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-field full">
        <label for="alamat">Alamat</label>
        <input class="input" type="text" id="alamat" name="alamat" maxlength="255" required value="{{ form.alamat }}">
    </div>
</div>
